# Sightline mounted at /sightline/ inside an EXISTING site. Paste these locations into the host app's
# existing `server { ... }` block (the one that already does SSO). Nothing else about Sightline changes.
#
# The key trick: proxy_pass ends in a trailing slash, so NGINX strips "/sightline/" before forwarding.
# Sightline itself still thinks it lives at "/", and its web page works out its own prefix in the browser.
#
# The host app needs this once, at http level, if it does not have it already:
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# /sightline  ->  /sightline/   (the page needs the trailing slash to find its files)
location = /sightline { return 301 /sightline/; }

# The live event stream. Longest prefix wins, so this takes /sightline/ws before the general block below.
location = /sightline/ws {
    proxy_pass http://127.0.0.1:8000/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host       $host;
    # Same signed-in user value the host app already computes (see your SSO setup).
    proxy_set_header X-Forwarded-User $sso_user;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering off;
}

location /sightline/ {
    proxy_pass http://127.0.0.1:8000/;      # <- the trailing slash is required
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # OVERWRITES anything the browser sent under this name. Never pass the client's value through.
    proxy_set_header X-Forwarded-User  $sso_user;
    client_max_body_size 20m;               # uploaded demo CSVs
}

# If the host app uses auth_request, put the same `auth_request` lines inside both locations above (or at server level).
