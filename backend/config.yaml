elastic:
  hosts:
    - "https://localhost:9200"
  # api_key is intentionally NOT set here -- see .env.example. Leave hosts
  # empty ([]) if you don't have Elastic wired up yet; the app runs fine
  # in CSV-only mode.
  index: "suricata-*"
  poll_interval_seconds: 3
  field_mapping:
    timestamp: "@timestamp"
    src_lat: "source.geo.location.lat"
    src_lon: "source.geo.location.lon"
    dst_lat: "destination.geo.location.lat"
    dst_lon: "destination.geo.location.lon"
    src_ip: "source.ip"
    dst_ip: "destination.ip"
    severity: "alert.severity"   # must resolve to critical / major / high
    # Optional alert-detail fields (shown in the detail panel). Delete a line
    # or leave the path unmatched and that field just shows as blank.
    signature: "rule.name"
    signature_id: "rule.id"
    category: "rule.category"
    protocol: "network.transport"
    src_port: "source.port"
    dst_port: "destination.port"
    action: "suricata.eve.alert.action"

# Optional: enables an "Open in Kibana" button on each event. Leave blank to hide it.
kibana:
  base_url: ""          # e.g. "https://kibana.example.com"
  data_view_id: ""      # the data view's ID (from its URL in Stack Management), not its name

server:
  host: "127.0.0.1"
  port: 8000

buffer:
  window_minutes: 10       # how old a real Elastic hit can be and still replay (see below)
  replay_enabled: true     # keep re-firing recent real hits so the map doesn't go blank on sparse traffic
  replay_interval_seconds: 5   # how often to fire a replayed hit