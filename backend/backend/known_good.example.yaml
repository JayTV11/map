# Sources you trust, so the map can stop showing their traffic.
#
# Copy this file to  backend/known_good.yaml  and edit it. known_good.yaml is
# gitignored on purpose: it describes your real network, which should not end
# up on GitHub. This example is safe to commit.
#
# In the app, the "Mute known-good sources" switch (ON by default) hides every
# event whose SOURCE address matches an entry below -- from the map, the log
# and the counters. A "N muted" badge on the map always says how many were
# hidden, so muting is never invisible. Muting only affects what this screen
# shows; nothing is deleted and Elastic is not touched.
#
# Changes are picked up within a minute -- no restart needed. If an edit breaks
# the file, the last good list stays in use and the problem is printed in the
# server log and shown at /api/status.
#
# Each entry is one of:
#   ip:    a single address            (IPv4 or IPv6)
#   cidr:  a range, like 10.20.9.0/24
#   note:  optional, what it is (shown as a tooltip on the muted badge)
# A bare address or range on its own line works too.

sources:
  - ip: 10.20.5.14
    note: Vulnerability scanner

  - cidr: 10.20.9.0/24
    note: Monitoring probes

  - 192.0.2.77
